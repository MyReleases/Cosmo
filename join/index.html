<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Приглашение в Cosmo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #e6edf5;
    background: radial-gradient(1200px 700px at 70% -10%, #1c3350 0%, #0d141d 55%, #090d13 100%);
  }
  main { width: 100%; max-width: 460px; padding: 32px 28px; border-radius: 16px; background: rgba(22, 31, 43, 0.92); border: 1px solid #2a3a4f; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45); }
  .brand { font-size: 28px; font-weight: 700; font-style: italic; letter-spacing: 0.5px; color: #fff; margin: 0 0 20px; }
  .brand i { display: inline-block; width: 14px; height: 14px; margin-right: 10px; border-radius: 50%; background: #ffb547; box-shadow: 0 0 18px #ffb547; }
  h1 { margin: 0 0 6px; font-size: 22px; line-height: 1.3; }
  p { margin: 0 0 12px; color: #a9b8c9; }
  .who { color: #e6edf5; font-weight: 600; }
  .btn { display: block; width: 100%; margin-top: 12px; padding: 13px 16px; border-radius: 10px; border: 1px solid #2f4159; background: #1b2636; color: #e6edf5; font: inherit; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; }
  .btn.primary { border: 0; background: linear-gradient(90deg, #1a9fff, #3d6bff); color: #fff; }
  .btn:hover { filter: brightness(1.1); }
  ol { margin: 18px 0 0; padding-left: 20px; color: #a9b8c9; font-size: 14.5px; }
  li { margin-bottom: 4px; }
  .small { margin-top: 18px; font-size: 13px; color: #7f8fa3; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand"><i></i>Cosmo</div>

  <div id="invite" hidden>
    <h1 id="title"></h1>
    <p id="from"></p>
    <a class="btn primary" id="open"></a>
    <a class="btn" id="download" href="https://github.com/MyReleases/Cosmo/releases/latest"></a>
    <ol>
      <li id="s1"></li>
      <li id="s2"></li>
      <li id="s3"></li>
    </ol>
    <p class="small" id="note"></p>
  </div>

  <div id="plain" hidden>
    <h1 id="ptitle"></h1>
    <p id="ptext"></p>
    <a class="btn primary" id="pdownload" href="https://github.com/MyReleases/Cosmo/releases/latest"></a>
  </div>
</main>
<script>
(function () {
  var ru = (navigator.language || 'ru').toLowerCase().indexOf('ru') === 0
  var T = ru
    ? {
        title: 'Вас приглашают в проект «{name}»',
        from: 'Приглашает @{owner}',
        fromFor: 'Приглашает @{owner}. Приглашение для @{login}',
        open: 'Открыть в Cosmo',
        download: 'Скачать Cosmo',
        s1: 'Если Cosmo ещё не установлен — скачайте и установите его.',
        s2: 'Войдите в Cosmo через GitHub{as}.',
        as: ' как @{login}',
        s3: 'Нажмите «Открыть в Cosmo» — проект загрузится после вашего подтверждения.',
        note: 'Проект хранится в закрытом репозитории владельца. Открыть его может только приглашённый.',
        ptitle: 'Cosmo — рабочее пространство продюсера',
        ptext: 'Эта ссылка не похожа на приглашение. Попросите владельца проекта прислать её ещё раз.',
        pdownload: 'Скачать Cosmo'
      }
    : {
        title: 'You are invited to the “{name}” project',
        from: 'Invited by @{owner}',
        fromFor: 'Invited by @{owner}. The invitation is for @{login}',
        open: 'Open in Cosmo',
        download: 'Download Cosmo',
        s1: 'If Cosmo is not installed yet, download and install it.',
        s2: 'Sign in to Cosmo with GitHub{as}.',
        as: ' as @{login}',
        s3: 'Press “Open in Cosmo” — the project downloads after you confirm.',
        note: 'The project lives in the owner’s private repository. Only the invited person can open it.',
        ptitle: 'Cosmo — a producer’s workspace',
        ptext: 'This link does not look like an invitation. Ask the project owner to send it again.',
        pdownload: 'Download Cosmo'
      }
  document.documentElement.lang = ru ? 'ru' : 'en'
  var set = function (id, text) { document.getElementById(id).textContent = text }
  // Данные приглашения идут после «#»: на сервер они не попадают. Принимаем только буквы, цифры, «-», «_», «.»
  var m = /^#([A-Za-z0-9-]{1,39})\/([A-Za-z0-9._-]{1,100})(?:@([A-Za-z0-9-]{1,39}))?$/.exec(location.hash)
  if (!m || m[2] === '.' || m[2] === '..') {
    set('ptitle', T.ptitle)
    set('ptext', location.hash.length > 1 ? T.ptext : '')
    set('pdownload', T.pdownload)
    document.getElementById('plain').hidden = false
    return
  }
  var owner = m[1], repo = m[2], login = m[3] || ''
  var name = repo.replace(/^cosmo-/, '')
  var app = 'cosmo://join/' + owner + '/' + repo + (login ? '@' + login : '')
  document.title = T.title.replace('{name}', name)
  set('title', T.title.replace('{name}', name))
  set('from', (login ? T.fromFor : T.from).replace('{owner}', owner).replace('{login}', login))
  set('open', T.open)
  set('download', T.download)
  set('s1', T.s1)
  set('s2', T.s2.replace('{as}', login ? T.as.replace('{login}', login) : ''))
  set('s3', T.s3)
  set('note', T.note)
  document.getElementById('open').href = app
  document.getElementById('invite').hidden = false
})()
</script>
</body>
</html>
